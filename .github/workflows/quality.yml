name: Site quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: node --check script.js && node --check account.js && node --check auth-config.js && node --check contact.js && node --check reservation.js && node --check diagnostic.js && node --check scripts/validate-site.mjs

      - name: Validate site structure and local references
        run: node scripts/validate-site.mjs
